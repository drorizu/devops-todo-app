name: DevOps To-Do CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check application syntax
        run: python -m py_compile app.py

      - name: Run application health test
        run: |
          python -c "import app; client = app.app.test_client(); response = client.get('/health'); assert response.status_code == 200; print('Health test passed')"

      - name: Build Docker image
        run: docker build -t devops-todo-app .
