name: DevOps To-Do CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Check application syntax
        run: python -m py_compile app.py

      - name: Run application health test
        run: |
          python -c "import app; client = app.app.test_client(); response = client.get('/health'); assert response.status_code == 200; print('Health test passed')"

      - name: Build Docker image
        run: docker build -t devops-todo-app .

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Docker image
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/drorizu/devops-todo-app:latest
            ghcr.io/drorizu/devops-todo-app:${{ github.sha }}
